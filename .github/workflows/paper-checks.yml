name: Paper and analysis

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q experiments

  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install TeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-science texlive-fonts-recommended
      - name: Build and check references
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          if grep -E 'There were undefined references|Reference .* undefined|Citation .* undefined|multiply defined|destination with the same identifier|Overfull \\[hv]box' main.log; then
            echo 'Unresolved references or layout/link errors in paper.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: main.pdf
          if-no-files-found: error
